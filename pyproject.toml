[project]
name = "overwatch-harness"
version = "0.1.0.dev0"
description = "Channel-multiplexer + classifier + router daemon. Spawns Claude Code sessions per operator engagement using the Max OAuth credentials. Replaces the broken claude-channels."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Jim Haist", email = "jamesdhaist@gmail.com" }]

# Pinned per the OPS-197 design (Anthropic guidance: no LangGraph/CrewAI/LangChain
# at this scale — direct asyncio + python-telegram-bot + claude -p subprocess).
dependencies = [
    "python-telegram-bot[asyncio]>=21,<22",
    "aiosqlite>=0.20,<1.0",
    "pydantic-settings>=2.4,<3.0",
    "httpx>=0.27,<1.0",
    "aiohttp>=3.10,<4.0",
    "hvac>=2.3,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-aiohttp>=1.0,<2.0",
    "ruff>=0.6,<1.0",
]

[project.scripts]
overwatch-harness = "harness.__main__:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["harness*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
